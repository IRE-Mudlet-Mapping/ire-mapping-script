name: Mapping session batching
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check XML, Lua syntax, and batching behavior
        run: |
          python3 tests/run.py
          python3 tests/test_runner.py
